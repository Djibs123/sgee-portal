# En-têtes de sécurité du front (inclus dans chaque `location` servant l'application :
# un `add_header` dans une location annule ceux du niveau `server`).
# Les réponses de l'API gardent leurs propres en-têtes (Helmet).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# À activer uniquement derrière HTTPS (terminaison TLS au proxy d'entrée) :
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
