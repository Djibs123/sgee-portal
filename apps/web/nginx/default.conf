# Front SGEE : fichiers statiques, repli SPA et mandataire vers l'API (même origine).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Pièces justificatives : 5 Mo côté API, marge pour l'enveloppe multipart.
  client_max_body_size 6m;

  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Fichiers fingerprintés par Vite : cache long.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    try_files $uri =404;
  }

  # Point d'entrée jamais mis en cache : un déploiement est pris en compte immédiatement.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    expires -1;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
