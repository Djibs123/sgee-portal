name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Front (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter web...
      - run: pnpm --filter web run lint
      - run: pnpm --filter web run typecheck
      - run: pnpm --filter web run test
      - run: pnpm --filter web run build

  api:
    name: API (lint, types, tests, e2e sur PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sgee
          POSTGRES_PASSWORD: sgee
          POSTGRES_DB: sgee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgee -d sgee_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # `prisma generate` (postinstall) lit la configuration ; les e2e remettent la base à zéro.
      DATABASE_URL: postgresql://sgee:sgee@localhost:5432/sgee_test
      TEST_DATABASE_URL: postgresql://sgee:sgee@localhost:5432/sgee_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter api...
      - run: pnpm --filter api run lint
      - run: pnpm --filter api run typecheck
      - run: pnpm --filter api run test
      - run: pnpm --filter api run build
      - run: pnpm --filter api run test:e2e

  audit:
    name: Dépendances vulnérables (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level high

  docker:
    name: Images Docker (build sans publication)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [web, api]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Image API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Image web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
