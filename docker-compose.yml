# Pile complète de démonstration / recette : PostgreSQL 18, migrations, API, front (nginx).
#   cp .env.example .env   # puis renseigner les secrets
#   docker compose up --build
# Portail : http://localhost:8080 — e-mails de test : http://localhost:8025
# En production : terminaison TLS devant `web`, secrets injectés par la plateforme, vrai SMTP.
name: sgee

x-api-environment: &api-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://sgee:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@db:5432/sgee
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant}
  ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET manquant}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY manquant}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  MAIL_FROM: ${MAIL_FROM:-SGEE <no-reply@sgee.local>}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
  FRONTEND_ORIGIN: ${PUBLIC_APP_URL:-http://localhost:8080}
  # Un saut : le nginx du service `web`.
  TRUST_PROXY: "1"
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sgee
      POSTGRES_USER: sgee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      # PostgreSQL 18 : le volume se monte sur /var/lib/postgresql (données dans 18/docker).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgee -d sgee"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Capture des e-mails (vérification, mot de passe oublié) : démonstration uniquement.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  migrate:
    build: &api-build
      context: .
      dockerfile: apps/api/Dockerfile
    image: sgee-api:local
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    image: sgee-api:local
    <<: *hardening
    environment: *api-environment
    tmpfs:
      - /tmp
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: sgee-web:local
    <<: *hardening
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
